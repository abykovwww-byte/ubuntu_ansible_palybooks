---
environment_name: local

server_timezone: "UTC"
server_locale: "en_US.UTF-8"

common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common
  - unzip
  - git
  - vim
  - htop

deploy_group_name: deploy
deploy_user_enabled: true
deploy_user_name: deploy
deploy_user_shell: /bin/bash
deploy_user_home: "/home/{{ deploy_user_name }}"
deploy_user_groups:
  - sudo

# Keep real keys in /etc/ansible/local-overrides.yml or an encrypted vault file.
ssh_public_keys: []

app_deploy_base_dir: /srv/apps
app_data_base_dir: /srv/app-data
app_backup_base_dir: /srv/backups
app_log_base_dir: /var/log/apps

service_directories:
  - path: "{{ app_deploy_base_dir }}"
    owner: root
    group: "{{ deploy_group_name }}"
    mode: "2775"
  - path: "{{ app_data_base_dir }}"
    owner: root
    group: "{{ deploy_group_name }}"
    mode: "2775"
  - path: "{{ app_backup_base_dir }}"
    owner: root
    group: "{{ deploy_group_name }}"
    mode: "2770"
  - path: "{{ app_log_base_dir }}"
    owner: root
    group: "{{ deploy_group_name }}"
    mode: "2775"
