---
hardening_manage_ssh: false
hardening_sshd_port: 22
hardening_permit_root_login: "no"
hardening_password_authentication: "no"
hardening_pubkey_authentication: "yes"
hardening_x11_forwarding: "no"
hardening_allow_users:
  - abykov
  - "{{ deploy_user_name }}"

hardening_manage_ufw: false
hardening_ufw_default_incoming_policy: deny
hardening_ufw_default_outgoing_policy: allow
hardening_ufw_allowed_ports:
  - port: "{{ hardening_sshd_port }}"
    proto: tcp
    comment: ssh
  - port: 80
    proto: tcp
    comment: http
  - port: 443
    proto: tcp
    comment: https

docker_users:
  - abykov
  - "{{ deploy_user_name }}"

docker_data_root: ""
docker_daemon_config: {}

tailscale_enabled: true
tailscale_hostname: abykovserv
tailscale_node_ip: "100.117.52.16"
tailscale_operator: abykov
tailscale_accept_dns: false
tailscale_ssh_enabled: false
tailscale_advertise_routes:
  - "192.168.1.88/32"

beszel_enabled: true
beszel_version: "0.18.7"
beszel_socket_proxy_image: lscr.io/linuxserver/socket-proxy:latest
beszel_project_dir: "{{ app_deploy_base_dir }}/beszel"
beszel_data_dir: "{{ app_data_base_dir }}/beszel/hub"
beszel_agent_data_dir: "{{ app_data_base_dir }}/beszel/agent"
beszel_socket_dir: "{{ app_data_base_dir }}/beszel/socket"
beszel_bind_hosts:
  - "192.168.1.88"
  - "{{ tailscale_node_ip }}"
beszel_host_port: 8090
beszel_app_url: "http://192.168.1.88:{{ beszel_host_port }}"
# Set both values in /etc/ansible/local-overrides.yml after creating the first
# Beszel user and adding this host in the web UI. Never commit them here.
beszel_agent_key: ""
beszel_agent_token: ""

task_reminder_domain: task.abykov.site
task_reminder_project_dir: "{{ app_deploy_base_dir }}/task-reminder"
task_reminder_data_dir: "{{ app_data_base_dir }}/task-reminder"
task_reminder_log_dir: "{{ app_log_base_dir }}/task-reminder"
task_reminder_bind_host: "127.0.0.1"
task_reminder_host_port: 3100
task_reminder_container_port: 3000
task_reminder_admin_password: "{{ lookup('ansible.builtin.password', '/etc/ansible/task-reminder-admin-password length=24 chars=ascii_letters,digits') }}"
task_reminder_session_secret: "{{ lookup('ansible.builtin.password', '/etc/ansible/task-reminder-session-secret length=48 chars=ascii_letters,digits') }}"
task_reminder_github_tasks_url: https://raw.githubusercontent.com/abykovwww-byte/task.abykov.site/main/tasks.json
task_reminder_github_sync_interval_seconds: 300
task_reminder_github_token: ""

hermes_enabled: true
hermes_image: nousresearch/hermes-agent:latest
hermes_project_dir: "{{ app_deploy_base_dir }}/hermes"
hermes_data_dir: "{{ app_data_base_dir }}/hermes"
hermes_log_dir: "{{ app_log_base_dir }}/hermes"
hermes_bind_host: "127.0.0.1"
hermes_gateway_host_port: 8642
hermes_dashboard_host_port: 9119
hermes_dashboard_domain: hermes.abykov.site
hermes_api_domain: api_hermes.abykov.site
hermes_api_alias_domain: api-hermes.abykov.site
hermes_dashboard_enabled: true
hermes_dashboard_insecure: true
hermes_api_server_enabled: true
hermes_api_server_key: "{{ lookup('ansible.builtin.password', '/etc/ansible/hermes-api-server-key length=48 chars=ascii_letters,digits') }}"
hermes_basic_auth_user: hermes
hermes_basic_auth_password: "{{ lookup('ansible.builtin.password', '/etc/ansible/hermes-dashboard-password length=24 chars=ascii_letters,digits') }}"
hermes_basic_auth_salt: "{{ lookup('ansible.builtin.password', '/etc/ansible/hermes-dashboard-salt length=16 chars=ascii_letters,digits') }}"
hermes_basic_auth_password_hash: "{{ lookup('ansible.builtin.pipe', 'openssl passwd -apr1 -salt ' ~ hermes_basic_auth_salt ~ ' ' ~ hermes_basic_auth_password) }}"
hermes_api_server_cors_origins: "*"
hermes_skip_config_migration: false
hermes_memory_limit: 4G
hermes_cpu_limit: "2.0"

opensearch_ad_enabled: true
opensearch_ad_version: "3.7.0"
opensearch_ad_project_dir: "{{ app_deploy_base_dir }}/opensearch-ad"
opensearch_ad_log_dir: "{{ app_log_base_dir }}/opensearch-ad"
opensearch_ad_bind_host: "127.0.0.1"
opensearch_ad_api_host_port: 9200
opensearch_ad_performance_host_port: 9600
opensearch_ad_dashboards_host_port: 5601
opensearch_ad_dashboards_domain: osearch.abykov.site
opensearch_ad_heap: "1g"
opensearch_ad_cluster_name: ad-analysis
opensearch_ad_admin_password: "{{ lookup('ansible.builtin.password', '/etc/ansible/opensearch-ad-admin-password length=32 chars=ascii_letters,digits') }}"
opensearch_ad_basic_auth_user: osearch
opensearch_ad_basic_auth_password: "{{ lookup('ansible.builtin.password', '/etc/ansible/opensearch-ad-dashboard-password length=24 chars=ascii_letters,digits') }}"
opensearch_ad_basic_auth_salt: "{{ lookup('ansible.builtin.password', '/etc/ansible/opensearch-ad-dashboard-salt length=16 chars=ascii_letters,digits') }}"
opensearch_ad_basic_auth_password_hash: "{{ lookup('ansible.builtin.pipe', 'openssl passwd -apr1 -salt ' ~ opensearch_ad_basic_auth_salt ~ ' ' ~ opensearch_ad_basic_auth_password) }}"

tovar_ai_enabled: true
tovar_ai_domain: tovar.abykov.site
tovar_ai_repo_url: https://github.com/abykovwww-byte/tovar.ai.git
tovar_ai_repo_version: master
tovar_ai_github_token: "{{ task_reminder_github_token | default('') }}"
tovar_ai_project_dir: "{{ app_deploy_base_dir }}/tovar-ai"
tovar_ai_data_dir: "{{ app_data_base_dir }}/tovar-ai"
tovar_ai_log_dir: "{{ app_log_base_dir }}/tovar-ai"
tovar_ai_bind_host: "127.0.0.1"
tovar_ai_host_port: 3101
tovar_ai_container_port: 3000
tovar_ai_llm_provider: "openrouter"
tovar_ai_llm_base_url: "https://openrouter.ai/api/v1"
tovar_ai_llm_model: "deepseek/deepseek-chat"
tovar_ai_llm_api_key: ""
tovar_ai_llm_timeout_seconds: 60
tovar_ai_llm_max_output_tokens: 1200
tovar_ai_openrouter_site_url: "https://tovar.abykov.site"
tovar_ai_openrouter_app_name: "tovar.ai"
tovar_ai_browser_extraction_enabled: true
tovar_ai_browser_timeout_ms: 20000
tovar_ai_browser_max_excerpt_chars: 12000
tovar_ai_browser_concurrency: 2
tovar_ai_extraction_provider_order: "local,browser_use,external"
tovar_ai_extraction_fallback_min_text_chars: 800
tovar_ai_browser_use_api_key: ""
tovar_ai_browser_use_base_url: "https://api.browser-use.com/api/v3"
tovar_ai_browser_use_model: "claude-sonnet-4.6"
tovar_ai_browser_use_timeout_seconds: 180
tovar_ai_browser_use_poll_interval_seconds: 2
tovar_ai_external_browser_api_url: ""
tovar_ai_external_browser_api_key: ""
tovar_ai_external_browser_timeout_seconds: 90

use_framework_enabled: true
use_framework_repo_url: https://github.com/abykovwww-byte/Unacceptable-security-event-USE-Framework.git
use_framework_repo_version: 27607a47e3763924755d34bbb0747a61d5d41def
# Required for this private repository; set only in /etc/ansible/local-overrides.yml.
use_framework_github_token: ""
use_framework_project_dir: "{{ app_deploy_base_dir }}/use-framework"
use_framework_data_dir: "{{ app_data_base_dir }}/use-framework"
use_framework_backup_dir: "{{ app_backup_base_dir }}/use-framework"
use_framework_inventory_source_host_path: "{{ use_framework_data_dir }}/import/ns1-assets.xlsx"
use_framework_inventory_source_container_path: "/data/import/ns1-assets.xlsx"
use_framework_api_token: "{{ lookup('ansible.builtin.password', '/etc/ansible/use-framework-api-token length=48 chars=ascii_letters,digits') }}"
use_framework_bind_host: "0.0.0.0"
use_framework_host_port: 8765

rp_stack_enabled: true
rp_stack_project_dir: "{{ app_deploy_base_dir }}/rp-stack"
rp_stack_storage_dir: "{{ app_data_base_dir }}/rp-stack"
rp_stack_config_dir: "{{ rp_stack_storage_dir }}/config"
rp_stack_data_dir: "{{ rp_stack_storage_dir }}/data"
rp_stack_plugins_dir: "{{ rp_stack_storage_dir }}/plugins"
rp_stack_extensions_dir: "{{ rp_stack_storage_dir }}/extensions"
rp_stack_gateway_data_dir: "{{ rp_stack_storage_dir }}/gateway"
rp_stack_backup_dir: "{{ app_backup_base_dir }}/rp-stack"
rp_stack_local_llm_enabled: true
rp_stack_local_llm_models_dir: "{{ rp_stack_storage_dir }}/models"
rp_stack_local_llm_model_dir: "{{ rp_stack_local_llm_models_dir }}/gemma-4-26b-a4b"
rp_stack_local_llm_image: "ghcr.io/ggml-org/llama.cpp:server-vulkan-b10088@sha256:3641a8e47d0ae168148ccef282eaab6aae8bd4ec903001b9518ffd11de912179"
rp_stack_local_llm_model_alias: "gemma-4-26b-a4b-it-rp-q4"
rp_stack_local_llm_model_filename: "gemma-4-26B_q4_0-it.gguf"
rp_stack_local_llm_model_revision: "d1c082be9cf3c8a514acf63b8761f4b41935842e"
rp_stack_local_llm_model_url: "https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf/resolve/{{ rp_stack_local_llm_model_revision }}/{{ rp_stack_local_llm_model_filename }}?download=true"
rp_stack_local_llm_model_sha256: "3eca3b8f6d7baf218a7dd6bba5fb59a56ee25fe2d567b6f5f589b4f697eca51d"
rp_stack_local_llm_base_url: "http://rp-local-llm:8080/v1"
rp_stack_local_llm_context_tokens: 32768
rp_stack_local_llm_gpu_layers: 99
rp_stack_local_llm_timeout_seconds: 240
rp_stack_state_dir: "{{ rp_stack_project_dir }}/state"
rp_stack_state_history_dir: "{{ rp_stack_state_dir }}/history"
rp_stack_state_proposed_dir: "{{ rp_stack_state_dir }}/proposed"
rp_stack_bind_host: "192.168.1.88"
rp_stack_bind_hosts:
  - "{{ rp_stack_bind_host }}"
  - "{{ tailscale_node_ip }}"
rp_stack_puid: 1000
rp_stack_pgid: 1000
rp_stack_nvidia_api_base: "https://integrate.api.nvidia.com/v1"
rp_stack_nvidia_model: "z-ai/glm-5.2"
rp_stack_nvidia_api_key: ""
rp_stack_nvidia_fallback_models:
  - "deepseek-ai/deepseek-v4-pro"
  - "deepseek-ai/deepseek-v4-flash"
  - "qwen/qwen3.5-397b-a17b"
rp_stack_nvidia_disabled_models: []
rp_stack_nvidia_model_catalog_live: true
rp_stack_nvidia_model_catalog_url: "https://build.nvidia.com/models?q=llm"
rp_stack_nvidia_model_catalog_ttl_seconds: 86400
rp_stack_gemini_api_base: "https://generativelanguage.googleapis.com/v1beta/openai"
rp_stack_gemini_api_key: ""
rp_stack_gemini_models:
  - "gemini-3.6-flash"
  - "gemini-3.5-flash"
rp_stack_gemini_model_catalog_live: true
rp_stack_openrouter_api_base: "https://openrouter.ai/api/v1"
rp_stack_openrouter_api_key: ""
rp_stack_openrouter_models:
  - "openrouter/auto"
  - "openrouter/free"
rp_stack_openrouter_model_catalog_live: true
rp_stack_provider_model_catalog_ttl_seconds: 86400
rp_stack_gateway_port: 8088
rp_stack_light_gui_host_port: 8010
rp_stack_showcase_gui_host_port: 8011
rp_stack_gateway_database_url: "sqlite:////data/rp_gateway.db"
rp_stack_gateway_log_level: INFO
rp_stack_gateway_log_prompts: "false"
rp_stack_gateway_max_repair_attempts: 1
rp_stack_gateway_request_timeout_seconds: 900
rp_stack_gateway_model_attempt_timeout_seconds: 150
rp_stack_gateway_party_start_model_attempt_timeout_seconds: 300
rp_stack_post_turn_helpers_inline: false
rp_stack_party_context_max_tokens: 131072
rp_stack_party_context_completion_reserve_tokens: 16384
rp_stack_party_context_system_reserve_tokens: 32768
rp_stack_party_context_min_history_tokens: 8192
rp_stack_service_model_choice: "local-gemma"
rp_stack_memory_summary_batch_tokens: 10000
rp_stack_party_memory_chapter_max_tokens: 6000
rp_stack_party_memory_chapter_max_chars: 24000
rp_stack_party_memory_prompt_max_chars: 60000
rp_stack_party_memory_retrieval_enabled: true
rp_stack_party_memory_retrieval_limit: 3
rp_stack_party_memory_retrieval_max_chars: 9000
rp_stack_rp_story_memory_update_turns: 4
rp_stack_rp_story_memory_batch_tokens: 6000
rp_stack_rp_story_memory_max_tokens: 6000
rp_stack_rp_story_memory_max_chars: 24000
rp_stack_rp_story_memory_prompt_max_chars: 24000
rp_stack_rp_story_memory_reserve_tokens: 10000
rp_stack_journal_auto_min_unsummarized_turns: 16
rp_stack_journal_max_batch_turns: 32
docker_apps:
  - name: beszel
    enabled: "{{ beszel_enabled }}"
    project_dir: "{{ beszel_project_dir }}"
    compose_template: beszel.compose.yml.j2
    env_template: beszel.env.j2
    env_example_template: beszel.env.example.j2
    env_mode: "0600"
    compose_up: true
    managed_directories:
      - "{{ beszel_project_dir }}"
      - "{{ beszel_data_dir }}"
      - "{{ beszel_agent_data_dir }}"
      - "{{ beszel_socket_dir }}"
  - name: task-reminder
    enabled: true
    source_dir: task-reminder
    project_dir: "{{ task_reminder_project_dir }}"
    compose_template: task-reminder.compose.yml.j2
    env_template: task-reminder.env.j2
    env_example_template: task-reminder.env.example.j2
    compose_up: true
    managed_directories:
      - "{{ task_reminder_project_dir }}"
      - "{{ task_reminder_data_dir }}"
      - "{{ task_reminder_log_dir }}"
  - name: hermes
    enabled: "{{ hermes_enabled }}"
    project_dir: "{{ hermes_project_dir }}"
    compose_template: hermes.compose.yml.j2
    compose_up: true
    managed_directories:
      - "{{ hermes_project_dir }}"
      - "{{ hermes_data_dir }}"
      - "{{ hermes_log_dir }}"
  - name: opensearch-ad
    enabled: "{{ opensearch_ad_enabled }}"
    project_dir: "{{ opensearch_ad_project_dir }}"
    compose_template: opensearch-ad.compose.yml.j2
    env_template: opensearch-ad.env.j2
    compose_up: true
    managed_directories:
      - "{{ opensearch_ad_project_dir }}"
      - "{{ opensearch_ad_log_dir }}"
  - name: tovar-ai
    enabled: "{{ tovar_ai_enabled }}"
    repo_url: "{{ tovar_ai_repo_url }}"
    repo_version: "{{ tovar_ai_repo_version }}"
    repo_token_var: tovar_ai_github_token
    repo_recreate_if_not_git: true
    project_dir: "{{ tovar_ai_project_dir }}"
    compose_template: tovar-ai.compose.yml.j2
    env_template: tovar-ai.env.j2
    env_example_template: tovar-ai.env.example.j2
    compose_up: true
    managed_directories:
      - "{{ tovar_ai_data_dir }}"
      - "{{ tovar_ai_log_dir }}"
  - name: use-framework
    enabled: "{{ use_framework_enabled }}"
    repo_url: "{{ use_framework_repo_url }}"
    repo_version: "{{ use_framework_repo_version }}"
    repo_version_is_commit: true
    repo_token_var: use_framework_github_token
    repo_recreate_if_not_git: true
    project_dir: "{{ use_framework_project_dir }}"
    owner: abykov
    group: abykov
    directory_mode: "0750"
    env_template: use-framework.env.j2
    env_example_template: use-framework.env.example.j2
    env_mode: "0600"
    compose_up: true
    compose_remove_orphans: true
    managed_directories:
      - "{{ use_framework_data_dir }}"
      - "{{ use_framework_data_dir }}/import"
      - "{{ use_framework_backup_dir }}"
  - name: rp-stack
    enabled: "{{ rp_stack_enabled }}"
    source_dir: rp-stack
    project_dir: "{{ rp_stack_project_dir }}"
    owner: abykov
    group: abykov
    directory_mode: "0750"
    compose_template: rp-stack.compose.yml.j2
    compose_filename: docker-compose.yml
    env_template: rp-stack.env.j2
    env_example_template: rp-stack.env.example.j2
    env_mode: "0600"
    compose_up: true
    compose_remove_orphans: true
    managed_directories:
      - "{{ rp_stack_project_dir }}"
      - "{{ rp_stack_config_dir }}"
      - "{{ rp_stack_data_dir }}"
      - "{{ rp_stack_plugins_dir }}"
      - "{{ rp_stack_extensions_dir }}"
      - "{{ rp_stack_gateway_data_dir }}"
      - "{{ rp_stack_local_llm_models_dir }}"
      - "{{ rp_stack_local_llm_model_dir }}"
      - "{{ rp_stack_backup_dir }}"
      - "{{ rp_stack_data_dir }}/default-user/QuickReplies"
      - "{{ rp_stack_data_dir }}/default-user/worlds"
      - "{{ rp_stack_state_dir }}"
      - "{{ rp_stack_state_dir }}/parties"
      - "{{ rp_stack_state_history_dir }}"
      - "{{ rp_stack_state_proposed_dir }}"
    runtime_source_files:
      - src: "rp-stack/worldpacks/awareness/sillytavern/awareness.json"
        path: "{{ rp_stack_data_dir }}/default-user/worlds/Awareness.json"
        mode: "0640"
        force: false
      - src: "rp-stack/worldpacks/awareness-one-day/sillytavern/awareness-one-day.json"
        path: "{{ rp_stack_data_dir }}/default-user/worlds/Awareness. One day.json"
        mode: "0640"
        force: false
    runtime_files:
      - path: "{{ rp_stack_state_dir }}/current.json"
        mode: "0640"
        content: |
          {
            "meta": {
              "campaign_id": "default",
