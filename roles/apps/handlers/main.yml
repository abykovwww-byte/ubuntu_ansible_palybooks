---
- name: Restart Docker app
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ app_project_dir }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  vars:
    app_project_dir: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  when:
    - app.enabled | default(true) | bool
    - app.compose_up | default(true) | bool
  register: docker_app_restart
  retries: "{{ app.compose_retries | default(docker_apps_compose_retries) }}"
  delay: "{{ app.compose_retry_delay | default(docker_apps_compose_retry_delay) }}"
  until: docker_app_restart.rc == 0
  changed_when: true
