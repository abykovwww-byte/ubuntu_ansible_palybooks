---
- name: Validate Docker app variables
  ansible.builtin.assert:
    that:
      - docker_apps is iterable
    fail_msg: "docker_apps must be a list of Docker Compose application definitions."
  tags: [apps, preflight]

- name: Require credentials for private Docker app repositories
  ansible.builtin.assert:
    that:
      - app_repo_token | length > 0
    fail_msg: "Enabled Docker app {{ app.name }} requires its server-local repository token."
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app.repo_token_required | default(false) | bool
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  no_log: true
  tags: [apps, preflight, source, git]

- name: Validate commit-pinned Docker app revisions
  ansible.builtin.assert:
    that:
      - (app.repo_version | default('')) is match('^[0-9a-f]{40}$')
    fail_msg: "Commit-pinned Docker app {{ app.name }} requires a full lowercase commit SHA."
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app.repo_version_is_commit | default(false) | bool
  tags: [apps, preflight, source, git]

- name: Prepare local Vulkan LLM runtime
  ansible.builtin.import_tasks: local-llm.yml
  when: rp_stack_local_llm_enabled | default(false) | bool
  tags: [apps, local-llm]

- name: Ensure Docker app directories exist
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    owner: "{{ item.0.owner | default(docker_apps_default_owner) }}"
    group: "{{ item.0.group | default(docker_apps_default_group) }}"
    mode: "{{ item.0.directory_mode | default(docker_apps_default_directory_mode) }}"
  loop: "{{ docker_apps | subelements('managed_directories', skip_missing=True) }}"
  when: item.0.enabled | default(true) | bool
  tags: [apps, directories]

- name: Check USE Framework private inventory source
  ansible.builtin.stat:
    path: "{{ use_framework_inventory_source_host_path }}"
  register: use_framework_inventory_source
  when: use_framework_enabled | default(false) | bool
  tags: [apps, preflight, use-framework]

- name: Require USE Framework private inventory source
  ansible.builtin.assert:
    that:
      - use_framework_inventory_source.stat.exists
      - use_framework_inventory_source.stat.isreg
    fail_msg: >-
      USE Framework requires the server-private NS1 registry at
      {{ use_framework_inventory_source_host_path }}; synthetic fixtures are forbidden in production.
  when: use_framework_enabled | default(false) | bool
  tags: [apps, preflight, use-framework]

- name: Check token-auth Docker app repository state
  ansible.builtin.stat:
    path: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/.git"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  register: docker_app_repo_state
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  tags: [apps, source, git]

- name: Remove non-git Docker app repository directories
  ansible.builtin.file:
    path: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
    state: absent
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
    index_var: app_index
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app.repo_recreate_if_not_git | default(false) | bool
    - app_repo_token | length > 0
    - not docker_app_repo_state.results[app_index].stat.exists
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  register: docker_app_removed_non_git
  tags: [apps, source, git]

- name: Clone token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -c
      - "http.extraHeader=Authorization: Basic {{ ('x-access-token:' ~ app_repo_token) | b64encode }}"
      - clone
      - --branch
      - "{{ app.repo_version | default('main') }}"
      - "{{ app.repo_url }}"
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
    index_var: app_index
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
    - not docker_app_repo_state.results[app_index].stat.exists
    - not (app.repo_version_is_commit | default(false) | bool)
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  no_log: true
  register: docker_app_token_clone
  tags: [apps, source, git]

- name: Clone commit-pinned token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -c
      - "http.extraHeader=Authorization: Basic {{ ('x-access-token:' ~ app_repo_token) | b64encode }}"
      - clone
      - --no-checkout
      - "{{ app.repo_url }}"
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
    index_var: app_index
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
    - not docker_app_repo_state.results[app_index].stat.exists
    - app.repo_version_is_commit | default(false) | bool
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  no_log: true
  register: docker_app_token_commit_clone
  tags: [apps, source, git]

- name: Fetch token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
      - -c
      - "safe.directory={{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
      - -c
      - "http.extraHeader=Authorization: Basic {{ ('x-access-token:' ~ app_repo_token) | b64encode }}"
      - fetch
      - origin
      - "{{ app.repo_version | default('main') }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  changed_when: false
  no_log: true
  tags: [apps, source, git]

- name: Reset token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
      - -c
      - "safe.directory={{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
      - reset
      - --hard
      - FETCH_HEAD
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  register: docker_app_token_reset
  tags: [apps, source, git]

- name: Clone public Docker app repositories
  ansible.builtin.git:
    repo: "{{ app.repo_url }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
    version: "{{ app.repo_version | default('main') }}"
    force: "{{ app.repo_force | default(false) }}"
    update: true
  environment:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length == 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  register: docker_app_public_repo
  tags: [apps, source, git]

- name: Normalize ownership for opt-in Docker app repositories
  ansible.builtin.file:
    path: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
    state: directory
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    recurse: true
    follow: false
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app.repo_normalize_ownership | default(false) | bool
  tags: [apps, source, git]

- name: Copy Docker app source
  ansible.builtin.copy:
    src: "{{ app.source_dir }}/"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "{{ app.file_mode | default(docker_apps_default_file_mode) }}"
    directory_mode: "{{ app.directory_mode | default(docker_apps_default_directory_mode) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.source_dir is defined
  register: docker_app_source_copy
  tags: [apps, source]

- name: Check retired RP Stack training source in managed checkout
  ansible.builtin.stat:
    path: "{{ rp_stack_project_dir }}/{{ item }}"
  loop:
    - rp-showcase-gui
    - worldpacks/awareness
    - worldpacks/awareness-one-day
    - ui-shared
    - scripts/validate-training-runtime.py
    - rp-gateway/app/services/showroom.py
    - rp-gateway/app/services/training_artifacts.py
    - rp-gateway/app/services/training_capabilities.py
    - rp-gateway/app/services/training_runtime.py
    - rp-gateway/app/services/training_workspace.py
    - rp-gateway/tests/test_showroom_portal.py
    - rp-gateway/tests/test_training_artifacts.py
    - rp-gateway/tests/test_training_capabilities.py
    - rp-gateway/tests/test_training_runtime.py
    - rp-gateway/tests/test_awareness_one_day.py
  when: rp_stack_enabled | default(false) | bool
  register: rp_stack_retired_training_source_state
  tags: [apps, preflight, source, rp-stack]

- name: Resolve retired RP Stack training source presence
  ansible.builtin.set_fact:
    rp_stack_retired_training_source_present: >-
      {{
        (
          rp_stack_retired_training_source_state.results | default([])
          | selectattr('stat', 'defined')
          | selectattr('stat.exists', 'defined')
          | selectattr('stat.exists', 'equalto', true)
          | list
          | length
        ) > 0
      }}
  tags: [apps, preflight, source, rp-stack]

- name: Create Docker app runtime files when missing
  ansible.builtin.copy:
    content: "{{ item.1.content }}"
    dest: "{{ item.1.path }}"
    owner: "{{ item.1.owner | default(item.0.owner | default(docker_apps_default_owner)) }}"
    group: "{{ item.1.group | default(item.0.group | default(docker_apps_default_group)) }}"
    mode: "{{ item.1.mode | default('0640') }}"
    force: false
  loop: "{{ docker_apps | subelements('runtime_files', skip_missing=True) }}"
  when: item.0.enabled | default(true) | bool
  register: docker_app_runtime_files
  tags: [apps, runtime]

- name: Copy Docker app runtime source files when missing
  ansible.builtin.copy:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.path }}"
    owner: "{{ item.1.owner | default(item.0.owner | default(docker_apps_default_owner)) }}"
    group: "{{ item.1.group | default(item.0.group | default(docker_apps_default_group)) }}"
    mode: "{{ item.1.mode | default('0640') }}"
    force: "{{ item.1.force | default(false) }}"
  loop: "{{ docker_apps | subelements('runtime_source_files', skip_missing=True) }}"
  when: item.0.enabled | default(true) | bool
  register: docker_app_runtime_source_files
  tags: [apps, runtime]

- name: Render Docker app compose files
  ansible.builtin.template:
    src: "{{ app.compose_template }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/{{ app.compose_filename | default('compose.yml') }}"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "0644"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.compose_template is defined
  register: docker_app_compose_templates
  tags: [apps, compose]

- name: Render Docker app environment files
  ansible.builtin.template:
    src: "{{ app.env_template }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/.env"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "{{ app.env_mode | default('0640') }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.env_template is defined
  register: docker_app_env_templates
  tags: [apps, env]

- name: Render Docker app example environment files
  ansible.builtin.template:
    src: "{{ app.env_example_template }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/.env.example"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "0644"
    force: "{{ app.env_example_force | default(true) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.env_example_template is defined
  register: docker_app_env_example_templates
  tags: [apps, env]

- name: Collect changed Docker apps from app-level tasks
  ansible.builtin.set_fact:
    docker_app_changed_names: "{{ (docker_app_changed_names | default([])) + [item.app.name] }}"
  loop: >-
    {{
      [
        docker_app_removed_non_git.results | default([]),
        docker_app_token_clone.results | default([]),
        docker_app_token_commit_clone.results | default([]),
        docker_app_token_reset.results | default([]),
        docker_app_public_repo.results | default([]),
        docker_app_source_copy.results | default([]),
        docker_app_compose_templates.results | default([]),
        docker_app_env_templates.results | default([])
      ] | flatten
    }}
  when:
    - item.changed | default(false) | bool
    - item.app is defined
    - item.app.name is defined
  no_log: true
  tags: [apps, compose]

- name: Collect changed Docker apps from runtime file tasks
  ansible.builtin.set_fact:
    docker_app_changed_names: "{{ (docker_app_changed_names | default([])) + [item.item.0.name] }}"
  loop: >-
    {{
      [
        docker_app_runtime_files.results | default([]),
        docker_app_runtime_source_files.results | default([])
      ] | flatten
    }}
  when:
    - item.changed | default(false) | bool
    - item.item is defined
    - item.item.0 is defined
    - item.item.0.name is defined
  tags: [apps, compose]

- name: Mark RP Stack changed for retired training source cleanup
  ansible.builtin.set_fact:
    docker_app_changed_names: "{{ (docker_app_changed_names | default([])) + ['rp-stack'] }}"
  when: rp_stack_retired_training_source_present | default(false) | bool
  tags: [apps, compose, rp-stack]

- name: Normalize changed Docker app list
  ansible.builtin.set_fact:
    docker_app_changed_names: "{{ docker_app_changed_names | default([]) | unique | list }}"
  tags: [apps, compose]

- name: Check pending Showroom port handoff
  ansible.builtin.stat:
    path: "{{ awareness_showroom_data_dir | default('/srv/app-data/awareness-showroom') }}/.port-8011-handoff-pending"
  register: showroom_port_handoff_marker
  tags: [apps, compose]

- name: Resolve coordinated Showroom port handoff
  ansible.builtin.set_fact:
    showroom_port_handoff_required: >-
      {{
        showroom_port_handoff_marker.stat.exists | default(false)
        or (rp_stack_retired_training_source_present | default(false) | bool)
        or (
          'rp-stack' in (docker_app_changed_names | default([]))
          and 'awareness-showroom' in (docker_app_changed_names | default([]))
        )
      }}
  tags: [apps, compose]

- name: Keep both cutover applications in the handoff start set
  ansible.builtin.set_fact:
    docker_app_changed_names: >-
      {{ (docker_app_changed_names + ['rp-stack', 'awareness-showroom']) | unique | list }}
  when: showroom_port_handoff_required | bool
  tags: [apps, compose]

- name: Persist pending Showroom port handoff
  ansible.builtin.file:
    path: "{{ awareness_showroom_data_dir | default('/srv/app-data/awareness-showroom') }}/.port-8011-handoff-pending"
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: showroom_port_handoff_required | bool
  tags: [apps, compose]

- name: Read standalone Showroom revision before handoff
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ awareness_showroom_project_dir | default(app_deploy_base_dir ~ '/awareness-showroom') }}"
      - -c
      - "safe.directory={{ awareness_showroom_project_dir | default(app_deploy_base_dir ~ '/awareness-showroom') }}"
      - rev-parse
      - HEAD
  register: awareness_showroom_handoff_revision
  changed_when: false
  when: showroom_port_handoff_required | bool
  tags: [apps, compose, source, git]

- name: Verify standalone Showroom exact revision before handoff
  ansible.builtin.assert:
    that:
      - awareness_showroom_handoff_revision.stdout == awareness_showroom_repo_version
    fail_msg: "Standalone Showroom checkout does not match the exact cutover revision."
  when: showroom_port_handoff_required | bool
  tags: [apps, compose, source, git]

- name: Validate Showroom handoff Compose configurations
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ item }}"
  loop:
    - "{{ rp_stack_project_dir }}"
    - "{{ awareness_showroom_project_dir | default(app_deploy_base_dir ~ '/awareness-showroom') }}"
  changed_when: false
  when: showroom_port_handoff_required | bool
  tags: [apps, compose]

- name: Prebuild Showroom handoff applications
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "{{ item }}"
  loop:
    - "{{ rp_stack_project_dir }}"
    - "{{ awareness_showroom_project_dir | default(app_deploy_base_dir ~ '/awareness-showroom') }}"
  changed_when: true
  when: showroom_port_handoff_required | bool
  tags: [apps, compose]

- name: Check legacy RP Showroom container before handoff
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - rp-stack-showcase-gui
  register: legacy_rp_showroom_container
  changed_when: false
  failed_when: false
  when: showroom_port_handoff_required | bool
  tags: [apps, compose]

- name: Stop legacy RP Showroom before handoff
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - rp-stack-showcase-gui
  when:
    - showroom_port_handoff_required | bool
    - legacy_rp_showroom_container.rc == 0
  changed_when: true
  tags: [apps, compose]

- name: Stop standalone Showroom before handoff
  ansible.builtin.command:
    cmd: docker compose stop showroom
    chdir: "{{ awareness_showroom_project_dir | default(app_deploy_base_dir ~ '/awareness-showroom') }}"
  when: showroom_port_handoff_required | bool
  changed_when: true
  tags: [apps, compose]

- name: Remove retired RP Stack training source from managed checkout
  ansible.builtin.file:
    path: "{{ rp_stack_project_dir }}/{{ item }}"
    state: absent
  loop:
    - rp-showcase-gui
    - worldpacks/awareness
    - worldpacks/awareness-one-day
    - ui-shared
    - scripts/validate-training-runtime.py
    - rp-gateway/app/services/showroom.py
    - rp-gateway/app/services/training_artifacts.py
    - rp-gateway/app/services/training_capabilities.py
    - rp-gateway/app/services/training_runtime.py
    - rp-gateway/app/services/training_workspace.py
    - rp-gateway/tests/test_showroom_portal.py
    - rp-gateway/tests/test_training_artifacts.py
    - rp-gateway/tests/test_training_capabilities.py
    - rp-gateway/tests/test_training_runtime.py
    - rp-gateway/tests/test_awareness_one_day.py
  when:
    - rp_stack_enabled | default(false) | bool
    - showroom_port_handoff_required | bool
  register: rp_stack_retired_training_source_removal
  tags: [apps, source, compose, rp-stack]

- name: Start changed Docker apps
  ansible.builtin.command:
    cmd: >-
      docker compose up -d --build
      {{ '--remove-orphans' if app.compose_remove_orphans | default(false) | bool else '' }}
    chdir: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.compose_up | default(true) | bool
    - >-
      app.name in (docker_app_changed_names | default([]))
      or (docker_apps_force_compose_up | default(false) | bool)
      or (app.compose_force | default(false) | bool)
  register: docker_app_start
  retries: "{{ app.compose_retries | default(docker_apps_compose_retries) }}"
  delay: "{{ app.compose_retry_delay | default(docker_apps_compose_retry_delay) }}"
  until: docker_app_start.rc == 0
  changed_when: true
  tags: [apps, compose]

- name: Clear completed Showroom port handoff
  ansible.builtin.file:
    path: "{{ awareness_showroom_data_dir | default('/srv/app-data/awareness-showroom') }}/.port-8011-handoff-pending"
    state: absent
  when: showroom_port_handoff_required | bool
  tags: [apps, compose]

- name: Configure Beszel monitoring agent
  ansible.builtin.import_tasks: beszel.yml
  when: beszel_enabled | default(false) | bool
  tags: [apps, beszel]
