---
- name: Validate Docker app variables
  ansible.builtin.assert:
    that:
      - docker_apps is iterable
    fail_msg: "docker_apps must be a list of Docker Compose application definitions."
  tags: [apps, preflight]

- name: Prepare local Vulkan LLM runtime
  ansible.builtin.import_tasks: local-llm.yml
  when: rp_stack_local_llm_enabled | default(false) | bool
  tags: [apps, local-llm]

- name: Ensure Docker app directories exist
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    owner: "{{ item.0.owner | default(docker_apps_default_owner) }}"
    group: "{{ item.0.group | default(docker_apps_default_group) }}"
    mode: "{{ item.0.directory_mode | default(docker_apps_default_directory_mode) }}"
  loop: "{{ docker_apps | subelements('managed_directories', skip_missing=True) }}"
  when: item.0.enabled | default(true) | bool
  tags: [apps, directories]

- name: Check token-auth Docker app repository state
  ansible.builtin.stat:
    path: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/.git"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  register: docker_app_repo_state
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  tags: [apps, source, git]

- name: Remove non-git Docker app repository directories
  ansible.builtin.file:
    path: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
    state: absent
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
    index_var: app_index
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app.repo_recreate_if_not_git | default(false) | bool
    - app_repo_token | length > 0
    - not docker_app_repo_state.results[app_index].stat.exists
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  tags: [apps, source, git]

- name: Clone token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -c
      - "http.extraHeader=Authorization: Basic {{ ('x-access-token:' ~ app_repo_token) | b64encode }}"
      - clone
      - --branch
      - "{{ app.repo_version | default('main') }}"
      - "{{ app.repo_url }}"
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
    index_var: app_index
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
    - not docker_app_repo_state.results[app_index].stat.exists
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  no_log: true
  notify: Restart Docker app
  tags: [apps, source, git]

- name: Fetch token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
      - -c
      - "http.extraHeader=Authorization: Basic {{ ('x-access-token:' ~ app_repo_token) | b64encode }}"
      - fetch
      - origin
      - "{{ app.repo_version | default('main') }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  changed_when: false
  no_log: true
  tags: [apps, source, git]

- name: Reset token-auth Docker app repositories
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
      - reset
      - --hard
      - FETCH_HEAD
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length > 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  notify: Restart Docker app
  tags: [apps, source, git]

- name: Clone public Docker app repositories
  ansible.builtin.git:
    repo: "{{ app.repo_url }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
    version: "{{ app.repo_version | default('main') }}"
    force: "{{ app.repo_force | default(false) }}"
    update: true
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.repo_url is defined
    - app_repo_token | length == 0
  vars:
    app_repo_token: "{{ lookup('vars', app.repo_token_var, default='') if app.repo_token_var is defined else '' }}"
  notify: Restart Docker app
  tags: [apps, source, git]

- name: Copy Docker app source
  ansible.builtin.copy:
    src: "{{ app.source_dir }}/"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "{{ app.file_mode | default(docker_apps_default_file_mode) }}"
    directory_mode: "{{ app.directory_mode | default(docker_apps_default_directory_mode) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.source_dir is defined
  notify: Restart Docker app
  tags: [apps, source]

- name: Create Docker app runtime files when missing
  ansible.builtin.copy:
    content: "{{ item.1.content }}"
    dest: "{{ item.1.path }}"
    owner: "{{ item.1.owner | default(item.0.owner | default(docker_apps_default_owner)) }}"
    group: "{{ item.1.group | default(item.0.group | default(docker_apps_default_group)) }}"
    mode: "{{ item.1.mode | default('0640') }}"
    force: false
  loop: "{{ docker_apps | subelements('runtime_files', skip_missing=True) }}"
  when: item.0.enabled | default(true) | bool
  tags: [apps, runtime]

- name: Copy Docker app runtime source files when missing
  ansible.builtin.copy:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.path }}"
    owner: "{{ item.1.owner | default(item.0.owner | default(docker_apps_default_owner)) }}"
    group: "{{ item.1.group | default(item.0.group | default(docker_apps_default_group)) }}"
    mode: "{{ item.1.mode | default('0640') }}"
    force: "{{ item.1.force | default(false) }}"
  loop: "{{ docker_apps | subelements('runtime_source_files', skip_missing=True) }}"
  when: item.0.enabled | default(true) | bool
  tags: [apps, runtime]

- name: Render Docker app compose files
  ansible.builtin.template:
    src: "{{ app.compose_template }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/{{ app.compose_filename | default('compose.yml') }}"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "0644"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.compose_template is defined
  notify: Restart Docker app
  tags: [apps, compose]

- name: Render Docker app environment files
  ansible.builtin.template:
    src: "{{ app.env_template }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/.env"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "{{ app.env_mode | default('0640') }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.env_template is defined
  notify: Restart Docker app
  tags: [apps, env]

- name: Render Docker app example environment files
  ansible.builtin.template:
    src: "{{ app.env_example_template }}"
    dest: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}/.env.example"
    owner: "{{ app.owner | default(docker_apps_default_owner) }}"
    group: "{{ app.group | default(docker_apps_default_group) }}"
    mode: "0644"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.env_example_template is defined
  tags: [apps, env]

- name: Start Docker apps
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ app.project_dir | default(app_deploy_base_dir ~ '/' ~ app.name) }}"
  loop: "{{ docker_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  when:
    - app.enabled | default(true) | bool
    - app.compose_up | default(true) | bool
  register: docker_app_start
  retries: "{{ app.compose_retries | default(docker_apps_compose_retries) }}"
  delay: "{{ app.compose_retry_delay | default(docker_apps_compose_retry_delay) }}"
  until: docker_app_start.rc == 0
  changed_when: false
  tags: [apps, compose]
