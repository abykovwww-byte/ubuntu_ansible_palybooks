[project]
name = "rp-gateway"
version = "0.4.0"
description = "FastAPI arbitration gateway for the SillyTavern RP stack"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
