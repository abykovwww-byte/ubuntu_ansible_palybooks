# Приёмочный манифест — предрегистрированные пороги оракула (Decision 022).
# Владелец файла — пользователь, не Codex. Пороги зафиксированы ДО реализации;
# оценщик читает их отсюда, исполнитель менять их не может. Изменение порогов
# или корпуса — отдельное, отдельно одобренное изменение (инвариант 6).
version: 1
labeled_by: user
frozen_at: "2026-08-11"

corpus: corpus/starosta-bootstrap.yml
corpus_hash: "sha256:b6e9167867b008bfd99c2a7e7f488f58b93e3bd50ff31dbd68e8115c397704d8"

# Все метрики считаются ещё и отдельно по каждому классу события.
per_event_class: true

# Пороги приёмки. Гейт красный, если хоть одна метрика на корпусе ниже пола
# (для empty_scene_false_positive_rate — выше). Строгие precision и FP: чужое
# или выдуманное событие отравляет модель мира дороже, чем пропуск. recall —
# умеренный на старте, поднимается по версиям корпуса (ratchet).
thresholds:
  event_precision: 0.85
  event_recall: 0.65
  character_id_accuracy: 0.90
  empty_scene_false_positive_rate: 0.05   # меньше — лучше
  positive_trust_recall: 0.70
  correction_retention: 0.90

# Уровень `держится`: сколько ходов подряд эффект сохраняется и учитывается
# сценами без дрейфа в production-endurance. Пол 40 (один цикл памяти); 50 — с
# запасом.
endurance:
  held_turns_N: 50

# Наблюдаемость служебной модели. Лог живёт в runtime-БД контейнера, не в git.
# Редакция — только секреты, нарратив остаётся (иначе аудит бессмыслен), наружу
# не экспортируется никогда.
service_call_log:
  retention_days: 30
  redaction: secrets-only
