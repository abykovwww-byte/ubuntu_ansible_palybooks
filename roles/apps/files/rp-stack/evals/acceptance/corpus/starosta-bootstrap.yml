# Приёмочный корпус — 36 ходов реальной RP-партии, размеченных пользователем.
# Обезличено: нарративная проза сокращена до сути, идентификатор партии не
# включён. Метки — ground truth того, каким должен был быть исход сцены; их
# ставит пользователь (не Codex, не Claude). Служебная модель прогоняется на
# player_input+scene_summary, её ответ сверяется с label. Пороги — в manifest.yml.
version: 2
labeled_by: user
frozen_at: "2026-08-11"
source: "derived from a real rp party (starosta), condensed and de-identified; party id withheld"
service_role: relationship_extraction

# Находки разметки, которые корпус фиксирует как требования:
notes:
  - "Тип события — отдельная ошибка от персонажа: модель может дать верного
     персонажа и знак, но неверный тип (T40: доверие, а не shared_risk)."
  - "Направление важно: доверие/благодарность может идти ОТ NPC к игроку
     (from_npc), а обязательство накладывается игроком НА NPC (on_npc)."
  - "Глюки нарратора и правки игрока (ГМ-режим) НЕ создают связей — они пустые
     для извлечения отношений, даже когда нарратор драматичен."

# Типы событий, которых миру сейчас не хватает (модель их выразить не может):
proposed_events:
  - trust_shown        # игрок доверяет NPC важное/приятное дело (on_npc, +)
  - trust_gained       # NPC начинает доверять игроку (from_npc, +)
  - gratitude          # NPC благодарен игроку (from_npc, +)
  - obligation         # игрок наложил обязательство на NPC (бейдж)
  - debt_to_player     # NPC в долгу перед игроком (бейдж)
  - suspicion          # NPC насторожен к игроку (from_npc, -)

