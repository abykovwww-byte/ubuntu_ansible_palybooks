<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RP Light GUI</title>
    <link rel="stylesheet" href="/styles.css?v=decision043-clean" />
  </head>
  <body>
    <section class="login-screen hidden" id="loginScreen">
      <form class="login-panel" id="loginForm">
        <div class="brand-mark">RP</div>
        <h1>Light GUI</h1>
        <label>Пользователь <input id="loginUsername" autocomplete="username" required /></label>
        <label>Пароль <input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <button class="primary-action" type="submit">Войти</button>
      </form>
    </section>

    <div class="app-shell" id="appShell">
      <aside class="party-rail">
        <div class="rail-head">
          <div><div class="brand-mark">RP</div><h1>Light GUI</h1></div>
          <button class="icon-button" id="refreshButton" title="Обновить">↻</button>
        </div>
        <button class="primary-action" id="newPartyButton">Новая партия</button>
        <div class="section-label">Партии</div>
        <div id="partyList" class="party-list"></div>
      </aside>

      <main class="chat-stage">
        <header class="top-bar">
          <div>
            <div class="crumb" id="activeWorld">Дневной Дозор</div>
            <h2 id="activePartyTitle">Выберите партию</h2>
          </div>
          <div class="status-strip"><span class="status-dot" id="gatewayDot"></span><span id="gatewayStatus">gateway</span></div>
        </header>
        <section class="chat-log" id="chatLog"></section>
        <div class="message-status-bar hidden" id="messageStatus" role="status"></div>
        <section class="gm-decision hidden" id="retryPanel">
          <strong id="retryTitle">Запрос не завершён</strong>
          <p class="panel-hint">Повтор использует тот же request/idempotency key и не создаёт второй ход.</p>
          <button class="tool-button" id="retryButton" type="button">Повторить</button>
        </section>
        <form class="composer" id="messageForm">
          <textarea id="messageInput" rows="2" placeholder="Действие или реплика персонажа" required></textarea>
          <button class="send-button" type="submit">Отправить</button>
        </form>
      </main>

      <aside class="inspector">
        <section class="summary-panel">
          <div class="section-label">Партия</div>
          <dl class="meta-grid" id="partyMeta"></dl>
        </section>
        <section class="summary-panel">
          <div class="section-label">Роли</div>
          <div id="roleCards" class="proposal-list">Выберите партию.</div>
        </section>
        <section class="summary-panel">
          <div class="section-label">Lore</div>
          <div id="loreList" class="proposal-list"></div>
          <form id="loreDraftForm">
            <label>Тип
              <select id="loreKind"><option value="character">Персонаж</option><option value="event">Событие</option><option value="location">Место</option></select>
            </label>
            <button class="tool-button" type="submit">Черновик из последнего хода</button>
          </form>
          <form id="loreConfirmForm" class="hidden">
            <label>Заголовок <input id="loreTitle" required /></label>
            <label>Текст <textarea id="loreContent" required></textarea></label>
            <label>Ключи <input id="loreKeywords" required /></label>
            <button class="primary-action" type="submit">Подтвердить Lore</button>
          </form>
        </section>
        <section class="summary-panel">
          <div class="section-label">PlayerCorrection</div>
          <form id="correctionForm">
            <textarea id="correctionInstruction" placeholder="Что исправить" required></textarea>
            <button class="tool-button" type="submit">Подготовить исправление</button>
          </form>
          <div id="correctionList" class="proposal-list"></div>
        </section>
        <section class="summary-panel">
          <div class="section-label">Administrator</div>
          <div id="administratorList" class="proposal-list"></div>
        </section>
        <section class="summary-panel">
          <div class="section-label">OpenRouter BYOK</div>
          <form id="byokForm">
            <input id="byokKey" type="password" placeholder="API key" required />
            <button class="tool-button" type="submit">Сохранить для партии</button>
          </form>
          <div id="byokList" class="proposal-list"></div>
        </section>
        <section class="summary-panel" id="accountPanel">
          <span id="currentUserLabel"></span>
          <button class="text-button" id="logoutButton" type="button">Выйти</button>
        </section>
      </aside>
    </div>

    <dialog id="partyDialog">
      <form id="partyForm" method="dialog" class="dialog-panel">
        <h2>Новая партия</h2>
        <label>Название <input id="partyTitle" required /></label>
        <label>Мир <select id="worldSelect" required></select></label>
        <label>Сценарий <select id="scenarioSelect" required></select></label>
        <label>Нарратор <select id="modelSelect" required></select></label>
        <div class="inline-actions">
          <button class="primary-action" type="submit">Создать</button>
          <button class="text-button" id="cancelPartyButton" type="button">Отмена</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>
    <script src="/app.js?v=decision043-clean"></script>
  </body>
</html>
