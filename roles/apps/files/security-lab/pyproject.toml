[project]
name = "security-lab-control"
version = "0.1.0"
description = "Evidence-backed OSINT and PentestGPT control plane for Codex"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp==1.26.0"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.uv]
package = false
