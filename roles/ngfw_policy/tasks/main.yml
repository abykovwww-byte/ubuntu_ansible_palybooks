---
- name: Validate explicit policy operation
  ansible.builtin.assert:
    that:
      - ngfw_policy_mode in ['plan', 'discover', 'prepare', 'check', 'apply', 'publish']
    fail_msg: Choose plan, discover, prepare, check, apply or an explicitly confirmed global publish.

- name: Plan or reconcile the isolated PT NGFW policy
  pt_ngfw_policy:
    mode: "{{ ngfw_policy_mode }}"
    config: "{{ ngfw_policy_config }}"
    inventory: "{{ ngfw_policy_inventory | default(omit) }}"
    login: "{{ ngfw_policy_login | default(omit, true) }}"
    password: "{{ ngfw_policy_password | default(omit, true) }}"
  register: ngfw_policy_result

- name: Save policy operation evidence
  ansible.builtin.include_tasks: evidence.yml
  vars:
    ngfw_policy_evidence_mode: "{{ ngfw_policy_mode }}"

- name: Explain the achieved evidence boundary
  ansible.builtin.debug:
    var: ngfw_policy_result.summary
