---
- name: Validate Tailscale variables
  ansible.builtin.assert:
    that:
      - tailscale_hostname | length > 0
      - tailscale_advertise_routes is iterable
    fail_msg: "Tailscale variables are invalid."
  when: tailscale_enabled | bool
  tags: [tailscale, preflight]

- name: Ensure Tailscale apt keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tailscale_enabled | bool
  tags: [tailscale, packages]

- name: Install Tailscale apt key
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_key_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  when: tailscale_enabled | bool
  tags: [tailscale, packages]

- name: Configure Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] {{ tailscale_apt_repo_url }} {{ tailscale_apt_distribution }} main"
    filename: tailscale
    state: present
    update_cache: true
  when: tailscale_enabled | bool
  tags: [tailscale, packages]

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
  when: tailscale_enabled | bool
  tags: [tailscale, packages]

- name: Ensure tailscaled is running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: tailscale_enabled | bool
  tags: [tailscale, service]

- name: Check current Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  no_log: true
  when: tailscale_enabled | bool
  tags: [tailscale, status]

- name: Read Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ ((tailscale_status.stdout | default('{}')) | from_json).BackendState | default('') }}"
  no_log: true
  when:
    - tailscale_enabled | bool
    - (tailscale_status.rc | default(1)) == 0
    - (tailscale_status.stdout | default('')) | length > 0
  tags: [tailscale, status]

- name: Detect whether Tailscale needs first login
  ansible.builtin.set_fact:
    tailscale_needs_login: "{{ (tailscale_status.rc | default(1)) != 0 or (tailscale_backend_state | default('')) == 'NeedsLogin' }}"
  no_log: true
  when: tailscale_enabled | bool
  tags: [tailscale, status]

- name: Build Tailscale up arguments
  ansible.builtin.set_fact:
    tailscale_up_args: >-
      {{
        [
          'up',
          '--reset',
          '--hostname=' ~ tailscale_hostname,
          '--accept-dns=' ~ (tailscale_accept_dns | bool | ternary('true', 'false'))
        ]
        + (((tailscale_needs_login | bool) and (tailscale_auth_key | length > 0)) | ternary(['--auth-key=' ~ tailscale_auth_key], []))
        + ((tailscale_operator | length > 0) | ternary(['--operator=' ~ tailscale_operator], []))
        + ((tailscale_ssh_enabled | bool) | ternary(['--ssh'], []))
        + ((tailscale_advertise_routes | length > 0) | ternary(['--advertise-routes=' ~ (tailscale_advertise_routes | join(','))], []))
        + ((tailscale_advertise_exit_node | bool) | ternary(['--advertise-exit-node'], []))
        + tailscale_extra_args
      }}
  no_log: true
  when: tailscale_enabled | bool
  tags: [tailscale, up]

- name: Bring Tailscale up
  ansible.builtin.command:
    argv: "{{ ['tailscale'] + tailscale_up_args }}"
  register: tailscale_up
  changed_when: "'Success' in (tailscale_up.stdout | default('')) or tailscale_up.rc == 0"
  no_log: true
  when:
    - tailscale_enabled | bool
    - not (tailscale_needs_login | bool) or tailscale_auth_key | length > 0
  tags: [tailscale, up]

- name: Show Tailscale auth key guidance
  ansible.builtin.debug:
    msg: "Set tailscale_auth_key in /etc/ansible/local-overrides.yml for the first Tailscale login."
  when:
    - tailscale_enabled | bool
    - tailscale_auth_key | length == 0
    - tailscale_needs_login | bool
  tags: [tailscale, up]
