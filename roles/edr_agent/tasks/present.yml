---
- name: Validate EDR agent variables and platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_architecture in ["x86_64", "amd64"]
      - edr_agent_server_host | length > 0
      - edr_agent_server_port | int > 0
      - edr_agent_server_port | int < 65536
      - edr_agent_version | length > 0
      - edr_agent_archive_url is match("^https://")
      - edr_agent_archive_sha256 is match("^[0-9a-fA-F]{64}$")
    fail_msg: "EDR agent variables or target platform are invalid."
  tags: [edr-agent, preflight]

- name: Install EDR archive prerequisite
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: false
  tags: [edr-agent, packages]

- name: Create EDR agent cache directory
  ansible.builtin.file:
    path: "{{ edr_agent_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [edr-agent, packages]

- name: Install the pinned download trust anchor
  ansible.builtin.copy:
    src: russian-trusted-root-ca.crt
    dest: "{{ edr_agent_download_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  tags: [edr-agent, packages]

- name: Verify the EDR agent server is reachable
  ansible.builtin.wait_for:
    host: "{{ edr_agent_server_host }}"
    port: "{{ edr_agent_server_port }}"
    state: started
    connect_timeout: 3
    timeout: 10
  changed_when: false
  tags: [edr-agent, preflight]

- name: Download the pinned EDR agent archive with TLS verification
  ansible.builtin.get_url:
    url: "{{ edr_agent_archive_url }}"
    dest: "{{ edr_agent_archive_path }}"
    checksum: "sha256:{{ edr_agent_archive_sha256 }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 120
    validate_certs: true
  environment:
    SSL_CERT_FILE: "{{ edr_agent_download_ca_path }}"
  tags: [edr-agent, packages]

- name: Extract the EDR agent archive
  ansible.builtin.unarchive:
    src: "{{ edr_agent_archive_path }}"
    dest: "{{ edr_agent_cache_dir }}"
    remote_src: true
    creates: "{{ edr_agent_deb_path }}"
  tags: [edr-agent, packages]

- name: Verify the pinned EDR package is present
  ansible.builtin.stat:
    path: "{{ edr_agent_deb_path }}"
  register: edr_agent_deb
  tags: [edr-agent, packages]

- name: Require the pinned EDR package
  ansible.builtin.assert:
    that:
      - edr_agent_deb.stat.exists
      - edr_agent_deb.stat.isreg
    fail_msg: "The expected EDR agent package is missing from the pinned archive."
  tags: [edr-agent, packages]

- name: Install the EDR agent package
  ansible.builtin.apt:
    deb: "{{ edr_agent_deb_path }}"
    state: present
  environment:
    VXSERVER_CONNECT: "{{ edr_agent_server_url }}"
  tags: [edr-agent, packages]

- name: Pin the EDR agent server connection
  ansible.builtin.lineinfile:
    path: "{{ edr_agent_service_env_path }}"
    regexp: '^CONNECT='
    line: "CONNECT={{ edr_agent_server_url }}"
    create: false
  notify: Restart vxagent
  tags: [edr-agent, config]

- name: Ensure the EDR agent is enabled and running
  ansible.builtin.systemd:
    name: vxagent.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [edr-agent, service]

- name: Apply an updated EDR connection immediately
  ansible.builtin.meta: flush_handlers

- name: Wait for the EDR agent log
  ansible.builtin.wait_for:
    path: "{{ edr_agent_log_path }}"
    state: present
    timeout: 30
  tags: [edr-agent, verify]

- name: Read the installed EDR agent version
  ansible.builtin.command:
    argv:
      - /opt/vxagent/bin/vxagent
      - -version
  register: edr_agent_installed_version
  changed_when: false
  tags: [edr-agent, verify]

- name: Verify the installed EDR agent version
  ansible.builtin.assert:
    that:
      - edr_agent_version in ((edr_agent_installed_version.stdout | default('')) ~ (edr_agent_installed_version.stderr | default('')))
    fail_msg: "The installed EDR agent version does not match the pinned package."
  tags: [edr-agent, verify]
