---
- name: Validate EDR agent state
  ansible.builtin.assert:
    that:
      - edr_agent_state in ["present", "absent"]
    fail_msg: "edr_agent_state must be present or absent."
  tags: [edr-agent, preflight]

- name: Apply the requested EDR agent state
  ansible.builtin.include_tasks: "{{ edr_agent_state }}.yml"
  tags: [edr-agent]
