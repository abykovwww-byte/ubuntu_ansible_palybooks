<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN · abykovserv</title>
<style>body{font:16px system-ui;margin:40px auto;padding:0 20px;max-width:760px;background:#f4f5f7;color:#20242b}main{background:white;border-radius:12px;padding:28px}h1{font-size:26px}#state{font-size:22px;font-weight:650}dt{color:#666;margin-top:15px}dd{margin:3px 0}li{margin:10px 0}.bad{color:#a31525}.good{color:#146940}</style>
<main><h1>VPN на abykovserv</h1><p id="state">Получаю состояние…</p>
<dl><dt>Текущая страна (метка провайдера)</dt><dd id="country">—</dd><dt>Пул</dt><dd id="pool">—</dd><dt>Последняя проверка</dt><dd id="time">—</dd><dt>Подписка</dt><dd id="subscription">—</dd></dl>
<p>При отказе узла шлюз пробует другие страны. При отказе всего пула прямой выход через этот прокси отсутствует. Событие сохраняется для доставки ботом после восстановления.</p>
<h2>События</h2><ul id="events"></ul></main>
<script>
const states={starting:'Шлюз запускается',checking:'Проверяю узлы VPN',healthy:'Telegram доступен через VPN',degraded:'Проверка Telegram не прошла',all_down:'Все проверенные узлы недоступны для Telegram',no_nodes:'Нет пригодных узлов подписки',stopped:'Шлюз остановлен'};
async function refresh(){try{const r=await fetch('/status.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();const fresh=Date.now()/1000-s.updated_at<90;const el=document.getElementById('state');el.textContent=fresh?(states[s.state]||s.state):'Данные устарели: состояние не подтверждено';el.className=fresh&&s.state==='healthy'?'good':'bad';document.getElementById('country').textContent=s.country||'—';document.getElementById('pool').textContent=`${s.supported_nodes||0} узлов; проверено в текущем поиске: ${s.tested_nodes||0}${s.phase==='scanning'?' · идёт поиск':''}`;document.getElementById('time').textContent=new Date(s.updated_at*1000).toLocaleString('ru-RU');document.getElementById('subscription').textContent=s.subscription_error?'Ошибка обновления; сохранённый пул используется, если доступен':(s.subscription_received_at?new Date(s.subscription_received_at*1000).toLocaleString('ru-RU'):'Ещё не получена');const list=document.getElementById('events');list.replaceChildren();for(const e of (s.events||[]).slice(-20).reverse()){const item=document.createElement('li');item.textContent=new Date(e.at*1000).toLocaleString('ru-RU')+' · '+(e.kind==='pool_down'?'Пул недоступен':'Связь восстановлена');list.append(item)}}catch{document.getElementById('state').textContent='Страница не получает состояние шлюза';document.getElementById('state').className='bad'}}refresh();setInterval(refresh,5000);
</script></html>
