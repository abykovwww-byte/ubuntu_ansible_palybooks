---
- name: Configure local deployment platform
  hosts: server
  become: true
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: tailscale
      tags: [tailscale]
      when: tailscale_enabled | default(false) | bool
    - role: edr_agent
      tags: [edr-agent]
      when: edr_agent_enabled | default(false) | bool
    - role: docker
      tags: [docker]
    - role: ngfw_lab
      tags: [ngfw-lab]
      when: ngfw_lab_enabled | default(false) | bool
    - role: apps
      tags: [apps]
    - role: ngfw_logs
      tags: [ngfw-logs]
      when: ngfw_logs_enabled | default(false) | bool
    - role: nginx
      tags: [nginx]
    - role: coolify
      tags: [coolify]
      when: coolify_enabled | bool
