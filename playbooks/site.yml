---
- name: Configure local deployment platform
  hosts: server
  become: true
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: tailscale
      tags: [tailscale]
      when: tailscale_enabled | default(false) | bool
    - role: edr_agent
      tags: [edr-agent]
      when: edr_agent_enabled | default(false) | bool
    - role: docker
      tags: [docker]
    - role: retired_hermes
      tags: [hermes-retirement]
      when: hermes_retired | default(false) | bool
    - role: ngfw_lab
      tags: [ngfw-lab]
      when: ngfw_lab_enabled | default(false) | bool
    - role: apps
      tags: [apps]
    - role: context_postgres
      tags: [context-postgres, telegram-archive]
      when: (context_postgres_enabled | default(false) | bool) or (telegram_archive_enabled | default(false) | bool)
    - role: telegram_archive
      tags: [telegram-archive]
      when: telegram_archive_enabled | default(false) | bool
    - role: ngfw_logs
      tags: [ngfw-logs]
      when: ngfw_logs_enabled | default(false) | bool
    - role: ngfw_metrics
      tags: [ngfw-metrics]
      when: ngfw_metrics_enabled | default(false) | bool
    - role: nginx
      tags: [nginx]
    - role: application_portal
      tags: [application-portal]
    - role: obsidian
      tags: [obsidian]
      when: obsidian_enabled | default(false) | bool
    - role: coolify
      tags: [coolify]
      when: coolify_enabled | bool
