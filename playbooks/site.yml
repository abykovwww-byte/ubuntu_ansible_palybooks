---
- name: Configure local deployment platform
  hosts: server
  become: true
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: tailscale
      tags: [tailscale]
      when: tailscale_enabled | default(false) | bool
    - role: docker
      tags: [docker]
    - role: ngfw_lab
      tags: [ngfw-lab]
      when: ngfw_lab_enabled | default(false) | bool
    - role: apps
      tags: [apps]
    - role: nginx
      tags: [nginx]
    - role: coolify
      tags: [coolify]
      when: coolify_enabled | bool
