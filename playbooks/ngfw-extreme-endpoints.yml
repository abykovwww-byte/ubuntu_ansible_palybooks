---
- name: Explicitly prepare or switch idle NGFW laboratory endpoints
  hosts: server
  connection: local
  gather_facts: false
  become: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Require explicit extreme preparation in this focused playbook
      ansible.builtin.assert:
        that:
          - ngfw_lab_extreme_enabled | bool
          - ngfw_lab_start_traffic | bool
    - name: Run only the focused endpoint operation
      ansible.builtin.import_role:
        name: ngfw_lab
        tasks_from: extreme_endpoints
