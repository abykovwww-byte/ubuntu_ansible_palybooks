name: NGFW native metrics components
on:
  pull_request:
    paths:
      - 'roles/ngfw_metrics/**'
      - 'roles/ngfw_native_source/**'
      - 'roles/ngfw_native_route/**'
      - 'roles/ngfw_lab/**'
      - 'playbooks/ngfw-metrics.yml'
      - 'playbooks/ngfw-metrics-evidence.yml'
      - 'playbooks/ngfw-metrics-external-tools.yml'
      - 'playbooks/ngfw-metrics-replay.yml'
      - 'playbooks/ngfw-native-discovery.yml'
      - 'playbooks/ngfw-native-route.yml'
      - 'playbooks/ngfw-extreme-endpoints.yml'
      - 'docs/ngfw-native-metrics-operations.md'
      - '.github/workflows/ngfw-native-metrics.yml'
      - 'scripts/check-ngfw-native-metrics.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ansible.txt
      - run: python -m unittest discover -s roles/ngfw_metrics/tests -v
      - run: python -m unittest discover -s roles/ngfw_native_route/tests -p 'test_native_route.py' -v
      - run: python -m unittest discover -s roles/ngfw_lab/tests -p 'test_native*.py' -v
      - run: python -m unittest discover -s roles/ngfw_lab/tests -p 'test_extreme*.py' -v
      - run: python scripts/check-ngfw-native-metrics.py
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: ansible-playbook -i inventories/local/hosts.yml playbooks/ngfw-metrics.yml --syntax-check
      - run: ansible-playbook -i inventories/local/hosts.yml playbooks/ngfw-metrics-evidence.yml --syntax-check
      - run: ansible-playbook -i inventories/local/hosts.yml playbooks/ngfw-metrics-external-tools.yml --syntax-check
      - run: ansible-playbook -i inventories/local/hosts.yml playbooks/ngfw-metrics-replay.yml --syntax-check
      - run: ansible-playbook -i inventories/ngfw-audit-source/hosts.yml playbooks/ngfw-native-discovery.yml --syntax-check
      - run: ansible-playbook -i inventories/ngfw-audit-source/hosts.yml playbooks/ngfw-native-route.yml --syntax-check
      - run: ansible-playbook -i inventories/local/hosts.yml playbooks/ngfw-extreme-endpoints.yml --syntax-check
