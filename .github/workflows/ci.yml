name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install PyYAML Jinja2
      - run: node --check roles/application_portal/files/assets/portal.js
      - run: python scripts/check-application-portal.py

  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML Jinja2
      - run: python -m unittest discover -s tests -p test_obsidian.py -v
      - run: python scripts/validate-obsidian.py

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/validate-repository.py
      - name: Validate devkit policy and MCP protocol
        shell: pwsh
        run: ./scripts/test-devkit.ps1

  pentestgpt:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Compose template dependency
        run: python -m pip install Jinja2==3.1.6
      - name: Validate IaC and bounded launcher
        run: |
          python scripts/check-pentestgpt.py
          python -m unittest tests/test_pentestgpt.py -v
      - name: Fetch the exact upstream source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/GreyDGL/PentestGPT.git /tmp/PentestGPT
          git -C /tmp/PentestGPT checkout --detach e8b1bb77d1ac00329675cec3b060aba971ec1ac8
          test "$(git -C /tmp/PentestGPT rev-parse HEAD)" = "e8b1bb77d1ac00329675cec3b060aba971ec1ac8"
          cp -a roles/apps/files/pentestgpt/. /tmp/PentestGPT/
          python scripts/render-pentestgpt-compose.py /tmp/PentestGPT/compose.yml
          docker compose --project-directory /tmp/PentestGPT --profile manual --profile fixture config --quiet
      - name: Build the pinned runtime and restricted proxy
        working-directory: /tmp/PentestGPT
        run: |
          docker build --file Dockerfile.abykovserv --build-arg PENTESTGPT_REVISION=e8b1bb77d1ac00329675cec3b060aba971ec1ac8 --tag pentestgpt-abykovserv:ci .
          docker build --file Dockerfile.proxy --tag pentestgpt-egress-proxy:ci .
      - name: Verify installed entry points
        run: |
          docker run --rm --entrypoint codex pentestgpt-abykovserv:ci --version
          docker run --rm --entrypoint codex pentestgpt-abykovserv:ci login --help
          docker run --rm --entrypoint pentestgpt-agent pentestgpt-abykovserv:ci --help
          docker run --rm --entrypoint python pentestgpt-abykovserv:ci -c "import pentestgpt_agent, unified_agent; assert unified_agent.__version__ == '0.3.0'"
          docker run --rm --entrypoint squid pentestgpt-egress-proxy:ci -k parse -f /etc/squid/squid.conf

  gateway:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roles/apps/files/rp-stack
    steps:
      - uses: actions/checkout@v4
      - name: Build Gateway image with test support
        run: docker build --file rp-gateway/Dockerfile --tag rp-stack-gateway-ci .
      - name: Run full Gateway tests inside the image
        run: time docker run --rm rp-stack-gateway-ci pytest -q

  browser-clients:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser client syntax
        shell: bash
        run: |
          node --check roles/apps/files/rp-stack/rp-light-gui/app.js
      - name: Run browser client tests
        shell: bash
        run: |
          find roles/apps/files/rp-stack -name '*.test.js' -print0 | sort -z | xargs -0 -n1 node

  ansible-syntax:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Verify effective application portal inventory
        run: python scripts/check-application-portal-inventory.py
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml
      - name: Check playbook syntax
        run: |
          ansible-playbook -i inventories/local/hosts.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/obsidian.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/application-portal.yml --syntax-check
