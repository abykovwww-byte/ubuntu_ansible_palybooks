name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-lab-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roles/apps/files/security-lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group network
      - name: Check case boundaries and real STDIO protocol with synthetic fixtures
        run: uv run --frozen pytest
      - name: Build the isolated network qualification image
        run: docker build -f Dockerfile.network-lab -t security-lab-network:ci .
      - name: Qualify actual nftables and HTTPS interception in synthetic Docker networks
        run: uv run --frozen --group network python lab/qualify_network.py --output /tmp/security-lab-receipts/network.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-lab-network-receipts
          path: /tmp/security-lab-receipts/

  application-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install PyYAML Jinja2
      - run: node --check roles/application_portal/files/assets/portal.js
      - run: python scripts/check-application-portal.py

  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML Jinja2
      - run: python -m unittest discover -s tests -p test_obsidian.py -v
      - run: python scripts/validate-obsidian.py

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/validate-repository.py
      - name: Validate devkit policy and MCP protocol
        shell: pwsh
        run: ./scripts/test-devkit.ps1

  pentestgpt:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Compose template dependency
        run: python -m pip install Jinja2==3.1.6
      - name: Validate IaC and bounded launcher
        run: |
          python scripts/check-pentestgpt.py
          python -m unittest tests/test_pentestgpt.py -v
      - name: Fetch the exact upstream source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/GreyDGL/PentestGPT.git /tmp/PentestGPT
          git -C /tmp/PentestGPT checkout --detach e8b1bb77d1ac00329675cec3b060aba971ec1ac8
          test "$(git -C /tmp/PentestGPT rev-parse HEAD)" = "e8b1bb77d1ac00329675cec3b060aba971ec1ac8"
          cp -a roles/apps/files/pentestgpt/. /tmp/PentestGPT/
          python scripts/render-pentestgpt-compose.py /tmp/PentestGPT/compose.yml
          docker compose --project-directory /tmp/PentestGPT --file /tmp/PentestGPT/compose.yml --profile manual --profile fixture config --quiet
      - name: Build the pinned runtime and restricted proxy
        working-directory: /tmp/PentestGPT
        run: |
          docker build --file Dockerfile.abykovserv --build-arg PENTESTGPT_REVISION=e8b1bb77d1ac00329675cec3b060aba971ec1ac8 --tag pentestgpt-abykovserv:ci .
          docker build --file Dockerfile.proxy --tag pentestgpt-egress-proxy:ci .
      - name: Verify installed entry points
        run: |
          docker run --rm --entrypoint codex pentestgpt-abykovserv:ci --version
          docker run --rm --entrypoint codex pentestgpt-abykovserv:ci login --help
          docker run --rm --entrypoint pentestgpt-agent pentestgpt-abykovserv:ci --help
          docker run --rm --entrypoint python pentestgpt-abykovserv:ci -c "import pentestgpt_agent, unified_agent; assert unified_agent.__version__ == '0.3.0'"
          docker run --rm --entrypoint squid pentestgpt-egress-proxy:ci -k parse -f /etc/squid/squid.conf
      - name: Verify Compose runtime, mounts, health, and network isolation
        working-directory: /tmp/PentestGPT
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose --file compose.yml --profile manual --profile fixture down --remove-orphans' EXIT
          sudo install -d -o 1000 -g 1000 /tmp/pentestgpt/runs /tmp/pentestgpt/workspace /tmp/pentestgpt/reports
          docker compose --file compose.yml up -d --wait --wait-timeout 60 egress-proxy target-dns
          test "$(docker inspect pentestgpt-egress-proxy-1 --format '{{.State.Health.Status}}')" = "healthy"
          test "$(docker inspect pentestgpt-target-dns-1 --format '{{.State.Health.Status}}')" = "healthy"
          test -z "$(docker port pentestgpt-egress-proxy-1)"
          test -z "$(docker port pentestgpt-target-dns-1)"
          docker compose --file compose.yml exec -T target-dns \
            dig +short +time=2 +tries=1 @127.0.0.1 -p 5353 nubes.ru A | grep -q .
          docker compose --file compose.yml exec -T target-dns \
            dig +noall +comments +time=2 +tries=1 @127.0.0.1 -p 5353 example.com A | grep -Eq 'status: (NXDOMAIN|REFUSED)'
          docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt bash -ec '
            test -r /home/pentester/.codex/config.toml
            test -w /home/pentester/.codex
            touch /home/pentester/.codex/.write-test /runs/.write-test /workspace/.write-test /reports/.write-test
            rm /home/pentester/.codex/.write-test /runs/.write-test /workspace/.write-test /reports/.write-test
            codex --version
            pentestgpt-agent --help >/dev/null
            pentestgpt-run --help >/dev/null
          '
          if docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt \
            env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            curl --fail --connect-timeout 5 --max-time 8 https://example.com/; then
            echo "direct runner egress unexpectedly succeeded" >&2
            exit 1
          fi
          if docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt \
            curl --fail --connect-timeout 5 --max-time 8 https://example.com/; then
            echo "proxy unexpectedly allowed an out-of-scope destination" >&2
            exit 1
          fi
          for destination in notnubes.ru nubes.ru.example.com 127.0.0.1; do
            status=$(docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt \
              curl --silent --output /dev/null --write-out '%{http_connect}' --noproxy '' \
              --connect-timeout 5 --max-time 8 "https://$destination/" || true)
            test "$status" = 403
          done
          test "$(docker network inspect pentestgpt_control --format '{{.Internal}}')" = "true"
          test "$(docker network inspect pentestgpt_target --format '{{.Internal}}')" = "true"

  gateway:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roles/apps/files/rp-stack
    steps:
      - uses: actions/checkout@v4
      - name: Build Gateway image with test support
        run: docker build --file rp-gateway/Dockerfile --tag rp-stack-gateway-ci .
      - name: Run full Gateway tests inside the image
        run: time docker run --rm rp-stack-gateway-ci pytest -q

  browser-clients:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser client syntax
        shell: bash
        run: |
          node --check roles/apps/files/rp-stack/rp-light-gui/app.js
      - name: Run browser client tests
        shell: bash
        run: |
          find roles/apps/files/rp-stack -name '*.test.js' -print0 | sort -z | xargs -0 -n1 node

  ansible-syntax:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ansible
        run: python -m pip install --requirement requirements-ansible.txt
      - name: Check local apply shell syntax
        run: bash -n scripts/apply-local.sh
      - name: Verify effective application portal inventory
        run: python scripts/check-application-portal-inventory.py
      - name: Install Ansible collections
        run: ansible-galaxy collection install --no-cache --timeout 30 -r collections/requirements.yml
      - name: Check playbook syntax
        run: |
          ansible-playbook -i inventories/local/hosts.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/obsidian.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/application-portal.yml --syntax-check
