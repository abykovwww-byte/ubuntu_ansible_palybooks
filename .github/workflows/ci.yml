name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpn-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test subscription, failover ordering and durable events
        run: python -m unittest discover -s tests -p test_vpn_egress.py -v
      - name: Build pinned Xray gateway
        run: docker build -t vpn-egress-ci roles/vpn_egress/files
      - name: Validate pinned core and real synthetic proxy boundary
        run: |
          docker run --rm --tmpfs /run/vpn-egress:uid=10001,gid=10001,mode=0700 \
            -v "$PWD:/repo:ro" -w /repo --entrypoint python vpn-egress-ci \
            -m unittest discover -s tests -p test_vpn_egress.py -v
  telegram-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3 Jinja2==3.1.6
      - run: python -m pip install 'psycopg[binary]==3.3.6'
      - run: python -m pip install --requirement requirements-ansible.txt
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - name: Test the server collector and its existing read-only Telegram boundaries
        working-directory: roles/telegram_collector/files
        run: uv run --frozen --extra dev pytest
      - name: Build the collector Linux image
        run: docker build -t telegram-collector-ci roles/telegram_collector/files
      - name: Verify actual collector proxy and fail-closed network with a synthetic target
        run: python scripts/test-telegram-collector-network.py
      - name: Validate archive deployment boundaries
        run: python -m unittest discover -s tests -p 'test_telegram_*.py' -v
      - name: Execute archive preflight with valid and invalid inputs
        run: python scripts/test-telegram-archive-ansible.py
      - name: Validate actual Ansible access files and sudoers syntax without root changes
        run: python scripts/test-telegram-collector-access.py
      - name: Validate actual Ansible configuration and Compose mount layout with dummy inputs
        run: python scripts/test-telegram-collector-config.py
      - name: Exercise PostgreSQL roles with synthetic data
        run: python scripts/test-telegram-archive-runtime.py
      - name: Check exact source IP and listener with the rendered network templates
        run: python scripts/test-context-postgres-network.py
      - name: Validate effective OpenSSH account restrictions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          python scripts/test-telegram-archive-ssh.py

  security-lab-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roles/apps/files/security-lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Check case boundaries and real STDIO protocol with synthetic fixtures
        run: uv run --frozen pytest

  application-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install PyYAML Jinja2
      - run: node --check roles/application_portal/files/assets/portal.js
      - run: python scripts/check-application-portal.py

  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML Jinja2
      - run: python -m unittest discover -s tests -p test_obsidian.py -v
      - run: python scripts/validate-obsidian.py

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/validate-repository.py
      - name: Validate devkit policy and MCP protocol
        shell: pwsh
        run: ./scripts/test-devkit.ps1

  pentestgpt:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Compose template dependency
        run: python -m pip install Jinja2==3.1.6
      - name: Validate IaC and bounded launcher
        run: |
          python scripts/check-pentestgpt.py
          python -m unittest tests/test_pentestgpt.py tests/test_codex_host.py -v
      - name: Fetch the exact upstream source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/GreyDGL/PentestGPT.git /tmp/PentestGPT
          git -C /tmp/PentestGPT checkout --detach e8b1bb77d1ac00329675cec3b060aba971ec1ac8
          test "$(git -C /tmp/PentestGPT rev-parse HEAD)" = "e8b1bb77d1ac00329675cec3b060aba971ec1ac8"
          cp -a roles/apps/files/pentestgpt/. /tmp/PentestGPT/
          python scripts/render-pentestgpt-compose.py /tmp/PentestGPT/compose.yml
          docker compose --project-directory /tmp/PentestGPT --file /tmp/PentestGPT/compose.yml --profile manual --profile fixture --profile tools config --quiet
      - name: Build the pinned runtime and restricted proxy
        working-directory: /tmp/PentestGPT
        run: |
          docker build --file Dockerfile.abykovserv --build-arg PENTESTGPT_REVISION=e8b1bb77d1ac00329675cec3b060aba971ec1ac8 --tag pentestgpt-abykovserv:ci .
          docker build --file Dockerfile.proxy --tag pentestgpt-egress-proxy:ci .
      - name: Verify installed entry points
        run: |
          docker run --rm --entrypoint codex pentestgpt-abykovserv:ci --version
          docker run --rm --entrypoint codex pentestgpt-abykovserv:ci login --help
          docker run --rm --network none --read-only --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=32m,uid=1000,gid=1000 --entrypoint python pentestgpt-abykovserv:ci /usr/local/libexec/pentestgpt-test-codex-host.py
          docker run --rm --entrypoint pentestgpt-agent pentestgpt-abykovserv:ci --help
          docker run --rm --network none --entrypoint pentestgpt-run pentestgpt-abykovserv:ci --capabilities
          docker run --rm --entrypoint /opt/pentestgpt-agent/.venv/bin/python pentestgpt-abykovserv:ci -c "import pentestgpt_agent, unified_agent; assert unified_agent.__version__ == '0.3.0'"
          docker run --rm --entrypoint squid pentestgpt-egress-proxy:ci -k parse -f /etc/squid/squid.conf
      - name: Qualify web tools against owned loopback fixture
        run: >-
          docker run --rm --network none --read-only --user 1000:1000
          --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --shm-size 256m
          --tmpfs /tmp:rw,nosuid,nodev,noexec,size=768m,uid=1000,gid=1000
          --add-host fixture.example.test:127.0.0.1 --env HOME=/tmp
          --entrypoint /opt/web-tools-venv/bin/python pentestgpt-abykovserv:ci
          /usr/local/libexec/pentestgpt-test-web-tools.py
      - name: Verify Compose runtime, mounts, health, and network isolation
        working-directory: /tmp/PentestGPT
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose --file compose.yml --profile manual --profile native --profile fixture --profile tools down --remove-orphans' EXIT
          sudo install -d -o 1000 -g 1000 /tmp/pentestgpt/runs /tmp/pentestgpt/workspace /tmp/pentestgpt/reports
          docker compose --file compose.yml up -d --wait --wait-timeout 60 egress-proxy target-dns
          test "$(docker inspect pentestgpt-egress-proxy-1 --format '{{.State.Health.Status}}')" = "healthy"
          test "$(docker inspect pentestgpt-target-dns-1 --format '{{.State.Health.Status}}')" = "healthy"
          test -z "$(docker port pentestgpt-egress-proxy-1)"
          test -z "$(docker port pentestgpt-target-dns-1)"
          docker compose --file compose.yml exec -T target-dns \
            dig +short +time=3 +tries=3 @127.0.0.1 -p 5353 nubes.ru A | grep -q .
          docker compose --file compose.yml exec -T target-dns \
            dig +noall +comments +time=2 +tries=1 @127.0.0.1 -p 5353 example.com A | grep -Eq 'status: (NXDOMAIN|REFUSED)'
          docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt bash -ec '
            test -r /home/pentester/.codex/config.toml
            test -w /home/pentester/.codex
            touch /home/pentester/.codex/.write-test /runs/.write-test /workspace/.write-test /reports/.write-test
            rm /home/pentester/.codex/.write-test /runs/.write-test /workspace/.write-test /reports/.write-test
            codex --version
            test -x /usr/local/bin/codex-code-mode-host
            pentestgpt-agent --help >/dev/null
            pentestgpt-run --help >/dev/null
          '
          docker compose --file compose.yml --profile tools run --rm -T --no-deps pentest-tools bash -ec '
            test "$(id -u)" != 0
            test ! -r /home/pentester/.codex/auth.json
            test "$(command -v python)" = /opt/pentestgpt-agent/.venv/bin/python
            test "$(command -v httpx)" = /opt/pentestgpt-tools/launchers/httpx
            nmap --version
            for tool in subfinder httpx nuclei katana; do "$tool" -version; done
            test -r /opt/pentestgpt-tools/installed-tools.json
            if touch /opt/pentestgpt-tools/.write-test; then
              echo "tool installation is unexpectedly writable" >&2
              exit 1
            fi
          '
          if docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt \
            env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            curl --fail --connect-timeout 5 --max-time 8 https://example.com/; then
            echo "direct runner egress unexpectedly succeeded" >&2
            exit 1
          fi
          if docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt \
            curl --fail --connect-timeout 5 --max-time 8 https://example.com/; then
            echo "proxy unexpectedly allowed an out-of-scope destination" >&2
            exit 1
          fi
          for destination in notnubes.ru nubes.ru.example.com 127.0.0.1; do
            status=$(docker compose --file compose.yml --profile manual run --rm --no-deps pentestgpt \
              curl --silent --output /dev/null --write-out '%{http_connect}' --noproxy '' \
              --connect-timeout 5 --max-time 8 "https://$destination/" || true)
            test "$status" = 403
          done
          test "$(docker network inspect pentestgpt_control --format '{{.Internal}}')" = "true"
          test "$(docker network inspect pentestgpt_target --format '{{.Internal}}')" = "true"

          # Native TCP mode is a separate explicit service. Exercise its actual
          # image and owned fixture without login, provider or Internet targets.
          docker compose --file compose.yml --profile fixture up -d --wait --wait-timeout 60 pentest-fixture
          docker compose --file compose.yml --profile native run --rm -T --no-deps --entrypoint python pentestgpt-native -c '
          import json, os, subprocess
          assert not any(os.environ.get(key) for key in ("HTTP_PROXY","HTTPS_PROXY","ALL_PROXY"))
          assert os.getuid() != 0
          capabilities = json.loads(subprocess.check_output(["pentestgpt-run","--capabilities"]))
          assert capabilities["native_targets_revision"] == 2 and capabilities["max_targets"] == 16
          response = subprocess.run(["curl","--fail","--noproxy","*","--max-time","10","http://pentest-fixture:8080/"], capture_output=True)
          assert response.returncode == 0 and response.stdout
          '

      - name: Qualify IPv6 connections and isolation on owned endpoints
        run: python scripts/test-pentestgpt-ipv6.py /tmp/PentestGPT/compose.yml

  gateway:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roles/apps/files/rp-stack
    steps:
      - uses: actions/checkout@v4
      - name: Build Gateway image with test support
        run: docker build --file rp-gateway/Dockerfile --tag rp-stack-gateway-ci .
      - name: Run full Gateway tests inside the image
        run: time docker run --rm rp-stack-gateway-ci pytest -q

  browser-clients:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser client syntax
        shell: bash
        run: |
          node --check roles/apps/files/rp-stack/rp-light-gui/app.js
      - name: Run browser client tests
        shell: bash
        run: |
          find roles/apps/files/rp-stack -name '*.test.js' -print0 | sort -z | xargs -0 -n1 node

  ansible-syntax:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ansible
        run: python -m pip install --requirement requirements-ansible.txt
      - name: Check local apply shell syntax
        run: bash -n scripts/apply-local.sh
      - name: Verify effective application portal inventory
        run: python scripts/check-application-portal-inventory.py
      - name: Install Ansible collections
        run: ansible-galaxy collection install --no-cache --timeout 30 -r collections/requirements.yml
      - name: Check playbook syntax
        run: |
          ansible-playbook -i inventories/local/hosts.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/vpn-egress.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/telegram-archive.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/telegram-collector.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/obsidian.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/application-portal.yml --syntax-check
